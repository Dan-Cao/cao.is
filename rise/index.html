<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>溜了溜了</title>
<meta name="description" content="From Rise Climbing to West Silvertown: is the 330 bus or the DLR quicker right now?">
<meta name="theme-color" content="#00a4a7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-peaks-192.png">
<link rel="apple-touch-icon" href="icon-peaks-192.png">
<script>
  // Apply the saved theme before the page draws, so it doesn't flash.
  try { const t = localStorage.getItem('theme:rise'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    --bg: #f4f6f6;
    --card: #ffffff;
    --text: #12201f;
    --muted: #5d6b6a;
    --dlr: #00a4a7;   /* DLR teal */
    --bus: #dc241f;   /* London bus red */
    --on-colour: #ffffff;
    --warn: #b34700;
    --border: #dde3e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1414;
      --card: #172020;
      --text: #e8efee;
      --muted: #93a3a2;
      --dlr: #00b5b8;
      --bus: #ff5a50;
      --on-colour: #10100f;
      --warn: #ff9a5a;
      --border: #263231;
    }
  }
  /* Warm themes, picked in Settings. Classic is the default above. */
  :root[data-theme="oat"] {
    --bg: #f6efe6;
    --card: #fffaf3;
    --text: #3a2e26;
    --muted: #86725f;
    --dlr: #2a9d9a;
    --bus: #d4483f;
    --on-colour: #fffaf3;
    --border: #eadfce;
  }
  :root[data-theme="peach"] {
    --bg: #fcece4;
    --card: #fff8f3;
    --text: #3d2a2a;
    --muted: #96706b;
    --dlr: #2a9d9a;
    --bus: #d9473f;
    --on-colour: #fff8f3;
    --border: #f2d8cd;
  }
  :root[data-theme="lavender"] {
    --bg: #f2edf8;
    --card: #fcfaff;
    --text: #2e2640;
    --muted: #7a6f8e;
    --dlr: #2a9d9a;
    --bus: #d4483f;
    --on-colour: #fcfaff;
    --border: #e1d9ee;
  }
  :root[data-theme="candle"] {
    --bg: #faf2df;
    --card: #fffaed;
    --text: #3b3022;
    --muted: #86745a;
    --dlr: #2a9d9a;
    --bus: #d14a3a;
    --on-colour: #fffaed;
    --border: #eee0c2;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="oat"] {
      --bg: #221b16;
      --card: #2e2520;
      --text: #f3e9dd;
      --muted: #b5a28f;
      --dlr: #3b9e9a;
      --bus: #cf5a4f;
      --on-colour: #fff8f0;
      --border: #3d322b;
    }
    :root[data-theme="peach"] {
      --bg: #281d21;
      --card: #35272c;
      --text: #f7e6e2;
      --muted: #bf9f9c;
      --dlr: #3b9e9a;
      --bus: #d65c55;
      --on-colour: #fff6f2;
      --border: #46333a;
    }
    :root[data-theme="lavender"] {
      --bg: #1e1a2a;
      --card: #29243a;
      --text: #ece6f7;
      --muted: #a79dbd;
      --dlr: #3b9e9a;
      --bus: #cf5a52;
      --on-colour: #fbf8ff;
      --border: #383150;
    }
    :root[data-theme="candle"] {
      --bg: #1d1913;
      --card: #29231a;
      --text: #f2e7d0;
      --muted: #b3a17d;
      --dlr: #3b9e9a;
      --bus: #cc5a45;
      --on-colour: #fff7e8;
      --border: #3a3125;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 480px;
    margin: 0 auto;
    -webkit-tap-highlight-color: transparent;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--muted); }
  #status { font-size: 13px; color: var(--muted); text-align: right; }
  #status.error { color: var(--warn); }

  .hero {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 20px;
    text-align: center;
  }
  .hero.bus { background: var(--bus); border-color: var(--bus); color: var(--on-colour); }
  .hero.dlr { background: var(--dlr); border-color: var(--dlr); color: var(--on-colour); }
  .hero .label { font-size: 15px; opacity: .85; }
  .hero .pick { font-size: 56px; font-weight: 800; line-height: 1.1; margin: 4px 0; }
  .hero .leave { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero .why { font-size: 14px; opacity: .9; margin-top: 6px; }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
  }
  .opt .tag {
    align-self: flex-start; font-weight: 800; font-size: 14px; color: var(--on-colour);
    border-radius: 8px; padding: 2px 8px;
  }
  .opt.bus .tag { background: var(--bus); }
  .opt.dlr .tag { background: var(--dlr); }
  .opt .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .opt .row { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .opt.none .big { font-size: 16px; color: var(--muted); }

  .walk { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .walk .wr { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; }
  .walk .wr + .wr { border-top: 1px solid var(--border); }
  .walk .wl { flex: 1; font-size: 14px; color: var(--muted); }
  .walk .wv { min-width: 52px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .walk button { width: 40px; height: 40px; padding: 0; border-radius: 10px; font-size: 20px; line-height: 1; }
  button {
    font: inherit; font-weight: 600; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px; width: 100%;
  }
  .settings summary {
    list-style: none; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted);
    padding: 4px 0; display: flex; align-items: center; gap: 6px;
  }
  .settings summary::-webkit-details-marker { display: none; }
  .settings summary::after { content: '▸'; }
  .settings[open] summary::after { content: '▾'; }
  .settings[open] summary { margin-bottom: 8px; }
  .settings .tip { margin-top: 8px; }
  .themes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
  .settings .theme {
    padding: 8px 2px; border-radius: 12px; font-size: 11px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .theme .sw {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
    background: linear-gradient(135deg, var(--day) 50%, var(--night) 50%);
  }
  .theme[aria-checked="true"] { border-color: var(--text); color: var(--text); }
  footer { margin-top: auto; font-size: 12px; color: var(--muted); text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
  <header>
    <h1>Rise → West Silvertown</h1>
    <div id="status">Loading…</div>
  </header>

  <section id="hero" class="hero" aria-live="polite">
    <div class="label">Checking bus and DLR…</div>
  </section>

  <div class="options">
    <div id="bus" class="opt bus"><span class="tag">330</span></div>
    <div id="dlr" class="opt dlr"><span class="tag">DLR</span></div>
  </div>

  <button id="refresh" type="button">Refresh</button>

  <details class="settings">
    <summary>⚙ Settings</summary>
    <div class="themes" role="radiogroup" aria-label="Theme">
      <button type="button" class="theme" role="radio" data-theme-pick="classic"><span class="sw" style="--day:#f4f6f6;--night:#0e1414"></span>Classic</button>
      <button type="button" class="theme" role="radio" data-theme-pick="oat"><span class="sw" style="--day:#f6efe6;--night:#221b16"></span>Oat</button>
      <button type="button" class="theme" role="radio" data-theme-pick="peach"><span class="sw" style="--day:#fcece4;--night:#281d21"></span>Peach</button>
      <button type="button" class="theme" role="radio" data-theme-pick="lavender"><span class="sw" style="--day:#f2edf8;--night:#1e1a2a"></span>Lavender</button>
      <button type="button" class="theme" role="radio" data-theme-pick="candle"><span class="sw" style="--day:#faf2df;--night:#1d1913"></span>Candle</button>
    </div>
    <div class="walk">
      <div class="wr">
        <span class="wl">Walk to bus stop</span>
        <button type="button" data-walk="bus" data-step="-1" aria-label="Less walking time to the bus">−</button>
        <span class="wv" id="walk-bus"></span>
        <button type="button" data-walk="bus" data-step="1" aria-label="More walking time to the bus">+</button>
      </div>
      <div class="wr">
        <span class="wl">Walk to DLR</span>
        <button type="button" data-walk="dlr" data-step="-1" aria-label="Less walking time to the DLR">−</button>
        <span class="wv" id="walk-dlr"></span>
        <button type="button" data-walk="dlr" data-step="1" aria-label="More walking time to the DLR">+</button>
      </div>
    </div>
  </details>

  <footer>Live data from <a href="https://api.tfl.gov.uk/">TfL</a>. Powered by TfL Open Data.</footer>

<script>
(() => {
  const TFL = 'https://api.tfl.gov.uk/StopPoint';
  const STOPS = {
    busBoard: '490007165S',  // Brunel Street, towards Pontoon Dock
    busAlight: '490013434E', // West Silvertown Station, towards Pontoon Dock
    dlrBoard: '940GZZDLCGT', // Canning Town DLR
    dlrAlight: '940GZZDLWSV', // West Silvertown DLR
  };
  const VIA_WEST_SILVERTOWN = /woolwich|king george|city airport|pontoon|west silvertown/i;
  const REFRESH_MS = 20000;

  // Walking minutes from Rise. Set with the − / + buttons and remembered on
  // the phone, so the installed app keeps them. An old ?bus=N&dlr=N link
  // still works and is saved when opened.
  const WALK_MAX = 30;
  const params = new URLSearchParams(location.search);
  const validMins = (v) => (v !== null && v !== '' && Number.isFinite(Number(v)) &&
    Number(v) >= 0 && Number(v) <= WALK_MAX ? Number(v) : null);
  function saveMins(key, mins) {
    try { localStorage.setItem(`walk:${key}`, String(mins)); } catch {}
  }
  function loadMins(key, fallback) {
    const fromUrl = validMins(params.get(key));
    if (fromUrl !== null) { saveMins(key, fromUrl); return fromUrl; }
    let stored = null;
    try { stored = validMins(localStorage.getItem(`walk:${key}`)); } catch {}
    return stored ?? fallback;
  }
  const WALK = { bus: loadMins('bus', 3) * 60000, dlr: loadMins('dlr', 7) * 60000 };
  const RIDE_FALLBACK = { bus: 4 * 60000, dlr: 3 * 60000 };

  const $ = (id) => document.getElementById(id);
  let options = null; // { bus: [...], dlr: [...] }, each {depart, arrive, platform?}
  let fetchedAt = null;
  let lastError = null;
  let inflight = false;

  const getArrivals = async (id) => {
    const res = await fetch(`${TFL}/${id}/Arrivals`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`TfL returned ${res.status}`);
    return res.json();
  };

  // Bus: follow each 330 by registration from Brunel Street to West Silvertown.
  function busOptions(board, alight) {
    const arriveByVehicle = new Map();
    for (const a of alight) {
      if (a.lineName === '330' && a.vehicleId) arriveByVehicle.set(a.vehicleId, new Date(a.expectedArrival));
    }
    return board
      .filter((a) => a.lineName === '330')
      .map((a) => {
        const depart = new Date(a.expectedArrival);
        const arrive = arriveByVehicle.get(a.vehicleId);
        return { depart, arrive: arrive > depart ? arrive : new Date(+depart + RIDE_FALLBACK.bus) };
      });
  }

  // DLR: trains carry no ID, so pair each Canning Town departure with the
  // first Woolwich-branch arrival at West Silvertown at least a minute later.
  function dlrOptions(board, alight) {
    const wsv = alight
      .filter((a) => VIA_WEST_SILVERTOWN.test(a.destinationName || '') && a.direction === 'outbound')
      .map((a) => new Date(a.expectedArrival))
      .sort((a, b) => a - b);
    return board
      .filter((a) => VIA_WEST_SILVERTOWN.test(a.destinationName || '') && a.direction === 'outbound')
      .map((a) => {
        const depart = new Date(a.expectedArrival);
        const arrive = wsv.find((t) => t - depart >= 60000 && t - depart <= 6 * 60000);
        return {
          depart,
          arrive: arrive || new Date(+depart + RIDE_FALLBACK.dlr),
          platform: (/(\d+)/.exec(a.platformName || '') || [])[1] || '?',
        };
      });
  }

  async function load() {
    if (inflight) return;
    inflight = true;
    $('status').textContent = 'Updating…';
    try {
      const [bb, ba, db, da] = await Promise.all(
        [STOPS.busBoard, STOPS.busAlight, STOPS.dlrBoard, STOPS.dlrAlight].map(getArrivals));
      const byDepart = (a, b) => a.depart - b.depart;
      options = { bus: busOptions(bb, ba).sort(byDepart), dlr: dlrOptions(db, da).sort(byDepart) };
      fetchedAt = new Date();
      lastError = null;
    } catch (e) {
      lastError = e;
    } finally {
      inflight = false;
      render();
    }
  }

  const clock = (d) => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const mins = (ms) => Math.max(0, Math.round(ms / 60000));
  const leaveText = (ms) => (ms < 60000 ? 'Leave now' : `Leave in ${mins(ms)} min`);

  // The first departure she can still walk to in time, or null.
  function best(mode, now) {
    return (options?.[mode] || []).find((o) => o.depart - now >= WALK[mode]) || null;
  }

  function renderOption(mode, o, now) {
    const el = $(mode);
    const tag = `<span class="tag">${mode === 'bus' ? '330' : 'DLR'}</span>`;
    if (!o) {
      el.classList.add('none');
      el.innerHTML = `${tag}<span class="big">${mode === 'bus' ? 'Bus' : 'DLR'} 摸鱼中</span>`;
      return;
    }
    el.classList.remove('none');
    el.innerHTML = `${tag}
      <span class="big">Arrive ${clock(o.arrive)}</span>
      <span class="row">${leaveText(o.depart - now - WALK[mode])}</span>
      <span class="row">${mode === 'bus' ? 'Brunel St' : `Platform ${o.platform}`} at ${clock(o.depart)}</span>`;
  }

  function render() {
    const now = Date.now();
    const bus = best('bus', now);
    const dlr = best('dlr', now);
    renderOption('bus', bus, now);
    renderOption('dlr', dlr, now);

    const hero = $('hero');
    if (options) {
      let pick = null;
      if (bus && dlr) pick = bus.arrive < dlr.arrive ? 'bus' : 'dlr';
      else pick = bus ? 'bus' : dlr ? 'dlr' : null;

      if (!pick) {
        hero.className = 'hero';
        hero.innerHTML = `<div class="label">No catchable bus or DLR listed right now</div>`;
      } else {
        const o = pick === 'bus' ? bus : dlr;
        const other = pick === 'bus' ? dlr : bus;
        // Compare whole clock minutes so the gap matches the times shown.
        const gap = other ? Math.floor(other.arrive / 60000) - Math.floor(o.arrive / 60000) : null;
        const why = !other
          ? `Only option listed · arrive ${clock(o.arrive)}`
          : gap === 0
            ? `About the same as the ${pick === 'bus' ? 'DLR' : '330'} · arrive ${clock(o.arrive)}`
            : `Arrive ${clock(o.arrive)} · ${gap} min sooner than the ${pick === 'bus' ? 'DLR' : '330'}`;
        hero.className = `hero ${pick}`;
        hero.innerHTML = `
          <div class="label">Get the</div>
          <div class="pick">${pick === 'bus' ? '330 bus' : `DLR · P${o.platform}`}</div>
          <div class="leave">${leaveText(o.depart - now - WALK[pick])}</div>
          <div class="why">${why}</div>`;
      }
    }

    const status = $('status');
    if (lastError) {
      status.classList.add('error');
      status.textContent = fetchedAt ? `Offline · data ${ago(fetchedAt)}` : 'Couldn’t reach TfL';
    } else if (fetchedAt && !inflight) {
      status.classList.remove('error');
      status.textContent = `Updated ${ago(fetchedAt)}`;
    }

    $('walk-bus').textContent = `${WALK.bus / 60000} min`;
    $('walk-dlr').textContent = `${WALK.dlr / 60000} min`;
  }

  function ago(d) {
    const s = Math.round((Date.now() - d) / 1000);
    return s < 5 ? 'just now' : s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`;
  }

  // Theme picker in Settings, remembered on the phone like the walk times.
  const THEME_KEY = 'theme:rise';
  const themeButtons = document.querySelectorAll('[data-theme-pick]');
  function showTheme() {
    const current = document.documentElement.dataset.theme || 'classic';
    themeButtons.forEach((b) => b.setAttribute('aria-checked', String(b.dataset.themePick === current)));
  }
  themeButtons.forEach((btn) => btn.addEventListener('click', () => {
    const pick = btn.dataset.themePick;
    if (pick === 'classic') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = pick;
    try { localStorage.setItem(THEME_KEY, pick); } catch {}
    showTheme();
  }));
  showTheme();

  $('refresh').addEventListener('click', load);
  document.querySelectorAll('[data-walk]').forEach((btn) => btn.addEventListener('click', () => {
    const mode = btn.dataset.walk;
    const mins = Math.min(WALK_MAX, Math.max(0, WALK[mode] / 60000 + Number(btn.dataset.step)));
    WALK[mode] = mins * 60000;
    saveMins(mode, mins);
    render();
  }));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') load();
  });
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, REFRESH_MS);
  setInterval(render, 1000);

  // An earlier version installed an offline service worker. Remove it from
  // phones that still have it.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then((regs) => regs.forEach((r) => r.unregister()))
      .catch(() => {});
  }
  load();
})();
</script>
</body>
</html>
