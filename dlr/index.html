<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silver Lining</title>
<meta name="description" content="Which Canning Town DLR platform to use for West Silvertown, and when the next train is due.">
<meta name="theme-color" content="#00a4a7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-tracks-192.png">
<link rel="apple-touch-icon" href="icon-tracks-192.png">
<script>
  // Apply the saved theme before the page draws, so it doesn't flash.
  try { const t = localStorage.getItem('theme:dlr'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    --bg: #f4f6f6;
    --card: #ffffff;
    --text: #12201f;
    --muted: #5d6b6a;
    --accent: #00a4a7; /* DLR teal */
    --accent-text: #ffffff;
    --warn: #b34700;
    --border: #dde3e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1414;
      --card: #172020;
      --text: #e8efee;
      --muted: #93a3a2;
      --accent: #00b5b8;
      --accent-text: #001a1a;
      --warn: #ff9a5a;
      --border: #263231;
    }
  }
  /* Warm themes, picked in Settings. Classic is the default above. */
  :root[data-theme="oat"] {
    --bg: #f6efe6;
    --card: #fffaf3;
    --text: #3a2e26;
    --muted: #86725f;
    --accent: #2a9d9a;
    --accent-text: #fffaf3;
    --border: #eadfce;
  }
  :root[data-theme="peach"] {
    --bg: #fcece4;
    --card: #fff8f3;
    --text: #3d2a2a;
    --muted: #96706b;
    --accent: #2a9d9a;
    --accent-text: #fff8f3;
    --border: #f2d8cd;
  }
  :root[data-theme="lavender"] {
    --bg: #f2edf8;
    --card: #fcfaff;
    --text: #2e2640;
    --muted: #7a6f8e;
    --accent: #2a9d9a;
    --accent-text: #fcfaff;
    --border: #e1d9ee;
  }
  :root[data-theme="candle"] {
    --bg: #faf2df;
    --card: #fffaed;
    --text: #3b3022;
    --muted: #86745a;
    --accent: #2a9d9a;
    --accent-text: #fffaed;
    --border: #eee0c2;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="oat"] {
      --bg: #221b16;
      --card: #2e2520;
      --text: #f3e9dd;
      --muted: #b5a28f;
      --accent: #3b9e9a;
      --accent-text: #fff8f0;
      --border: #3d322b;
    }
    :root[data-theme="peach"] {
      --bg: #281d21;
      --card: #35272c;
      --text: #f7e6e2;
      --muted: #bf9f9c;
      --accent: #3b9e9a;
      --accent-text: #fff6f2;
      --border: #46333a;
    }
    :root[data-theme="lavender"] {
      --bg: #1e1a2a;
      --card: #29243a;
      --text: #ece6f7;
      --muted: #a79dbd;
      --accent: #3b9e9a;
      --accent-text: #fbf8ff;
      --border: #383150;
    }
    :root[data-theme="candle"] {
      --bg: #1d1913;
      --card: #29231a;
      --text: #f2e7d0;
      --muted: #b3a17d;
      --accent: #3b9e9a;
      --accent-text: #fff7e8;
      --border: #3a3125;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 480px;
    margin: 0 auto;
    -webkit-tap-highlight-color: transparent;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--muted); }
  #status { font-size: 13px; color: var(--muted); text-align: right; }
  #status.error { color: var(--warn); }

  .hero {
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 20px;
    padding: 24px 20px;
    text-align: center;
  }
  .hero .label { font-size: 15px; opacity: .85; }
  .hero .platform { font-size: 112px; font-weight: 800; line-height: 1; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .hero .due { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero .dest { font-size: 14px; opacity: .85; margin-top: 4px; }
  .hero.empty .platform { font-size: 40px; padding: 24px 0; }

  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  li .p {
    flex: none; width: 40px; height: 40px; border-radius: 10px;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-weight: 800; font-size: 20px;
  }
  li .d { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .t { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  li.missed { opacity: .45; }

  .tip { font-size: 13px; color: var(--muted); margin: 0; }
  .walk {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 10px 12px 10px 16px;
  }
  .walk .wl { flex: 1; font-size: 14px; color: var(--muted); }
  .walk .wv { min-width: 52px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .walk button { width: 40px; height: 40px; padding: 0; border-radius: 10px; font-size: 20px; line-height: 1; }
  button {
    font: inherit; font-weight: 600; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px; width: 100%;
  }
  .settings summary {
    list-style: none; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted);
    padding: 4px 0; display: flex; align-items: center; gap: 6px;
  }
  .settings summary::-webkit-details-marker { display: none; }
  .settings summary::after { content: '▸'; }
  .settings[open] summary::after { content: '▾'; }
  .settings[open] summary { margin-bottom: 8px; }
  .settings .tip { margin-top: 8px; }
  .themes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
  .settings .theme {
    padding: 8px 2px; border-radius: 12px; font-size: 11px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .theme .sw {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
    background: linear-gradient(135deg, var(--day) 50%, var(--night) 50%);
  }
  .theme[aria-checked="true"] { border-color: var(--text); color: var(--text); }
  footer { margin-top: auto; font-size: 12px; color: var(--muted); text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
  <header>
    <h1>Canning Town → West Silvertown</h1>
    <div id="status">Loading…</div>
  </header>

  <section id="hero" class="hero empty" aria-live="polite">
    <div class="label">Next train</div>
    <div class="platform">…</div>
  </section>

  <ul id="list" hidden></ul>

  <button id="refresh" type="button">Refresh</button>

  <details class="settings">
    <summary>⚙ Settings</summary>
    <div class="themes" role="radiogroup" aria-label="Theme">
      <button type="button" class="theme" role="radio" data-theme-pick="classic"><span class="sw" style="--day:#f4f6f6;--night:#0e1414"></span>Classic</button>
      <button type="button" class="theme" role="radio" data-theme-pick="oat"><span class="sw" style="--day:#f6efe6;--night:#221b16"></span>Oat</button>
      <button type="button" class="theme" role="radio" data-theme-pick="peach"><span class="sw" style="--day:#fcece4;--night:#281d21"></span>Peach</button>
      <button type="button" class="theme" role="radio" data-theme-pick="lavender"><span class="sw" style="--day:#f2edf8;--night:#1e1a2a"></span>Lavender</button>
      <button type="button" class="theme" role="radio" data-theme-pick="candle"><span class="sw" style="--day:#faf2df;--night:#1d1913"></span>Candle</button>
    </div>
    <div class="walk">
      <span class="wl">Walk from the Jubilee</span>
      <button type="button" data-walk="walk" data-step="-1" aria-label="Less walking time">−</button>
      <span class="wv" id="walkValue"></span>
      <button type="button" data-walk="walk" data-step="1" aria-label="More walking time">+</button>
    </div>
    <p class="tip" id="walkTip"></p>
  </details>

  <footer>Live data from <a href="https://api.tfl.gov.uk/">TfL</a>. Powered by TfL Open Data.</footer>

<script>
(() => {
  const STOP = '940GZZDLCGT'; // Canning Town DLR
  const API = `https://api.tfl.gov.uk/StopPoint/${STOP}/Arrivals`;
  // Trains from Canning Town that call at West Silvertown run on the
  // Woolwich Arsenal branch. Short workings may terminate earlier on it.
  const VIA_WEST_SILVERTOWN = /woolwich|king george|city airport|pontoon|west silvertown/i;
  const REFRESH_MS = 20000;

  // Minutes needed to get from the Jubilee to the DLR platform. Trains due
  // sooner than that are greyed out and skipped for the big number.
  // Set with the − / + buttons and remembered on the phone, so the installed
  // app keeps it. An old ?walk=N link still works and is saved when opened.
  const WALK_DEFAULT = 2;
  const WALK_MAX = 30;
  const params = new URLSearchParams(location.search);
  const validMins = (v) => (v !== null && v !== '' && Number.isFinite(Number(v)) &&
    Number(v) >= 0 && Number(v) <= WALK_MAX ? Number(v) : null);
  function saveMins(key, mins) {
    try { localStorage.setItem(`walk:${key}`, String(mins)); } catch {}
  }
  function loadMins(key, fallback) {
    const fromUrl = validMins(params.get(key));
    if (fromUrl !== null) { saveMins(key, fromUrl); return fromUrl; }
    let stored = null;
    try { stored = validMins(localStorage.getItem(`walk:${key}`)); } catch {}
    return stored ?? fallback;
  }
  let walkSecs = loadMins('walk', WALK_DEFAULT) * 60;

  const $ = (id) => document.getElementById(id);
  let trains = [];       // [{platform, dest, expected: Date}]
  let fetchedAt = null;
  let lastError = null;
  let inflight = false;

  function platformNumber(name) {
    const m = /(\d+)/.exec(name || '');
    return m ? m[1] : '?';
  }

  function cleanDest(name) {
    return (name || '').replace(/\s*DLR Station$/i, '');
  }

  async function load() {
    if (inflight) return;
    inflight = true;
    $('status').textContent = 'Updating…';
    try {
      const res = await fetch(API, { cache: 'no-store' });
      if (!res.ok) throw new Error(`TfL returned ${res.status}`);
      const data = await res.json();
      trains = data
        .filter((a) => VIA_WEST_SILVERTOWN.test(a.destinationName || '') &&
                       (a.direction || 'outbound') === 'outbound')
        .map((a) => ({
          platform: platformNumber(a.platformName),
          dest: cleanDest(a.destinationName),
          expected: new Date(a.expectedArrival),
        }))
        .sort((a, b) => a.expected - b.expected);
      fetchedAt = new Date();
      lastError = null;
    } catch (e) {
      lastError = e;
    } finally {
      inflight = false;
      render();
    }
  }

  function fmtDue(secs) {
    if (secs < 30) return 'Due';
    const mins = Math.round(secs / 60);
    return mins <= 1 ? '1 min' : `${mins} mins`;
  }

  function render() {
    const now = Date.now();
    const upcoming = trains
      .map((t) => ({ ...t, secs: (t.expected - now) / 1000 }))
      .filter((t) => t.secs > -20);

    const hero = $('hero');
    const catchable = upcoming.find((t) => t.secs >= walkSecs) || upcoming[0];

    if (catchable) {
      hero.classList.remove('empty');
      hero.innerHTML = `
        <div class="label">Go to platform</div>
        <div class="platform">${catchable.platform}</div>
        <div class="due">${fmtDue(catchable.secs)}</div>
        <div class="dest">to ${catchable.dest}</div>`;
    } else if (fetchedAt) {
      hero.classList.add('empty');
      hero.innerHTML = `<div class="label">Next train</div><div class="platform">No trains listed</div>`;
    }

    const list = $('list');
    const rest = upcoming.filter((t) => t !== catchable);
    list.hidden = rest.length === 0;
    list.innerHTML = rest.map((t) => `
      <li class="${t.secs < walkSecs ? 'missed' : ''}">
        <span class="p">${t.platform}</span>
        <span class="d">${t.dest}</span>
        <span class="t">${fmtDue(t.secs)}</span>
      </li>`).join('');

    const status = $('status');
    if (lastError) {
      status.classList.add('error');
      status.textContent = fetchedAt ? `Offline · data ${ago(fetchedAt)}` : 'Couldn’t reach TfL';
    } else if (fetchedAt && !inflight) {
      status.classList.remove('error');
      status.textContent = `Updated ${ago(fetchedAt)}`;
    }

    $('walkValue').textContent = `${walkSecs / 60} min`;
    $('walkTip').textContent = walkSecs
      ? `Trains due in under ${walkSecs / 60} min are greyed out as too close to make.`
      : '';
  }

  function ago(d) {
    const s = Math.round((Date.now() - d) / 1000);
    return s < 5 ? 'just now' : s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`;
  }

  // Theme picker in Settings, remembered on the phone like the walk times.
  const THEME_KEY = 'theme:dlr';
  const themeButtons = document.querySelectorAll('[data-theme-pick]');
  function showTheme() {
    const current = document.documentElement.dataset.theme || 'classic';
    themeButtons.forEach((b) => b.setAttribute('aria-checked', String(b.dataset.themePick === current)));
  }
  themeButtons.forEach((btn) => btn.addEventListener('click', () => {
    const pick = btn.dataset.themePick;
    if (pick === 'classic') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = pick;
    try { localStorage.setItem(THEME_KEY, pick); } catch {}
    showTheme();
  }));
  showTheme();

  $('refresh').addEventListener('click', load);
  document.querySelectorAll('[data-walk]').forEach((btn) => btn.addEventListener('click', () => {
    const mins = Math.min(WALK_MAX, Math.max(0, walkSecs / 60 + Number(btn.dataset.step)));
    walkSecs = mins * 60;
    saveMins(btn.dataset.walk, mins);
    render();
  }));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') load();
  });
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, REFRESH_MS);
  setInterval(render, 1000);

  // An earlier version installed an offline service worker. Remove it from
  // phones that still have it.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then((regs) => regs.forEach((r) => r.unregister()))
      .catch(() => {});
  }
  load();
})();
</script>
</body>
</html>
